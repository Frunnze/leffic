load_module modules/ngx_http_js_module.so;

pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

env JWT_SECRET_KEY;

http {
    access_log /dev/stdout;
    error_log /dev/stderr;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    resolver 127.0.0.11 valid=10s ipv6=off;

    js_path /etc/nginx/njs/;
    js_import jwt from jwt.js;
    js_set $jwt_status jwt.status;

    map $http_origin $allowed_origin {
        default "";
        "http://localhost:3009" $http_origin;
    }

    map $request_uri $authentication_limit_key {
        default "";
        "~^/+api/user/(?!refresh-token|logout|account)" $binary_remote_addr;
    }

    map $request_uri $generation_cost_limit_key {
        default "";
        "~^/+api/+content/+(\./+)*(c|%63|%43)hat(\?|$)" $binary_remote_addr;
        "~^/+api/+content/+(\./+)*(e|%65|%45)xtract-text(\?|$)"
            $binary_remote_addr;
        "~^/+api/+content/+(\./+)*(u|%75|%55)pload-files(\?|$)"
            $binary_remote_addr;
        "~^/+api/+content/+(\./+)*(g|%67|%47)enerate-study-units(\?|$)"
            $binary_remote_addr;
    }

    limit_req_zone $authentication_limit_key zone=auth_limit:10m rate=10r/m;
    limit_req_zone $generation_cost_limit_key zone=cost_limit:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=20r/s;

    server {
        listen 8080;
        client_max_body_size 100m;

        limit_req zone=auth_limit burst=5 nodelay;
        limit_req zone=cost_limit burst=10 nodelay;
        limit_req zone=general_limit burst=40 nodelay;
        limit_req_status 429;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Expose-Headers;

        add_header Access-Control-Allow-Origin $allowed_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Headers
            "Authorization, Content-Type, Range" always;
        add_header Access-Control-Expose-Headers
            "Accept-Ranges, Content-Range, Content-Length" always;
        add_header Access-Control-Allow-Methods
            "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Max-Age 3600 always;
        add_header Vary Origin always;

        location /api/user/ {
            if ($request_method = OPTIONS) {
                return 204;
            }

            set $user_service user-service;
            rewrite ^/api/user/(.*)$ /$1 break;
            proxy_pass http://$user_service:8000;
        }

        location /api/user/account {
            if ($request_method = OPTIONS) {
                return 204;
            }

            if ($jwt_status != "ok") {
                return 401;
            }

            set $account_service user-service;
            rewrite ^/api/user/(.*)$ /$1 break;
            proxy_pass http://$account_service:8000;
        }

        location /api/content/ {
            if ($request_method = OPTIONS) {
                return 204;
            }

            if ($jwt_status != "ok") {
                return 401;
            }

            set $content_service content-management-service;
            rewrite ^/api/content/(.*)$ /$1 break;
            proxy_pass http://$content_service:8000;
        }

        location ~ ^/api/content/(upload-files|file|extract-text)$ {
            if ($request_method = OPTIONS) {
                return 204;
            }

            if ($jwt_status != "ok") {
                return 401;
            }

            set $documents_service content-documents;
            rewrite ^/api/content/(.*)$ /$1 break;
            proxy_pass http://$documents_service:8000;
        }

        location / {
            return 404;
        }
    }
}
