x-healthcheck-timing: &healthcheck-timing
  interval: 5s
  timeout: 5s
  retries: 20
  start_period: 10s

x-user-service-environment: &user-service-environment
  - DB_USER=postgres
  - DB_PASS=postgres
  - DB_HOST=postgres
  - DB_PORT=5432
  - JWT_SECRET_KEY=${JWT_SECRET_KEY}
  - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/

x-content-service: &content-service
  build: ./content-management-service
  environment:
    - CM_DB_USER=postgres
    - CM_DB_PASS=postgres
    - CM_DB_HOST=postgres
    - CM_DB_PORT=5432
    - REDIS_HOST=redis:6379
    - OPENAI_API_KEY=${OPENAI_API_KEY}
    - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
  depends_on:
    content-migrations:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  restart: unless-stopped

services:
  frontend:
    build:
      context: ./ui-service
      args:
        - VITE_GATEWAY_URL=${VITE_GATEWAY_URL:-http://localhost:8888}
    ports:
      - "3009:80"
    restart: unless-stopped

  api-gateway:
    build: ./api-gateway
    ports:
      - 8888:80
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    depends_on:
      - user-service
      - content-management-service
      - content-documents
    restart: unless-stopped

  content-migrations:
    <<: *content-service
    command: alembic upgrade head
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  content-management-service:
    <<: *content-service
    volumes:
      - files:/app/files

  content-documents:
    <<: *content-service
    build:
      context: ./content-management-service
      dockerfile: Dockerfile.documents
    volumes:
      - files:/app/files

  celery-worker:
    <<: *content-service
    command: >
      celery -A features.study_units_generation.celery_app worker
      --loglevel info

  user-events-consumer:
    <<: *content-service
    volumes:
      - files:/app/files
    command: python run_consumer.py

  user-migrations:
    build: ./user-service
    environment: *user-service-environment
    command: alembic upgrade head
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  user-service:
    build: ./user-service
    environment: *user-service-environment
    depends_on:
      user-migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-alpine
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      <<: *healthcheck-timing
    restart: unless-stopped

  redis:
    image: redis:6.2-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *healthcheck-timing
    restart: unless-stopped

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      <<: *healthcheck-timing
    restart: unless-stopped

volumes:
  rabbitmq:
  redis-data:
  files:
  postgres:
