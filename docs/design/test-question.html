<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test — question · Leffic design</title>
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="app-tokens.css">
<link rel="stylesheet" href="app-rail.css">
<link rel="stylesheet" href="app-controls.css">
<link rel="stylesheet" href="app-test.css">
</head>
<body class="shell" data-screen="test-question">
<main class="shell-stage">
  <div class="frame">
    <div class="screen">
      <nav class="rail" aria-label="Main">
        <div>
          <div class="rail-logo"><svg aria-hidden="true"><use href="#icon-logo"/></svg></div>
          <ul class="rail-list">
            <li><a class="rail-item" href="home.html"><svg class="icon" aria-hidden="true"><use href="#icon-home"/></svg>Home</a></li>
            <li><button class="rail-item" type="button"><svg class="icon" aria-hidden="true"><use href="#icon-ask"/></svg>Ask</button></li>
          </ul>
        </div>
        <div class="rail-foot-wrap">
          <button class="rail-foot" type="button" aria-expanded="false">
            <svg class="icon" aria-hidden="true"><use href="#icon-profile"/></svg>Profile
          </button>
        </div>
      </nav>
      <div class="test-stage">
        <div class="test-inner">
            <div class="test-card">
              <h1 class="test-question">Which ion rushes into the neuron during the rising phase of an action potential?</h1>
              <div class="test-options">
              <button class="test-option" type="button" aria-pressed="false"><span class="test-key">A</span>Potassium</button>
              <button class="test-option" type="button" aria-pressed="true"><span class="test-key">B</span>Sodium</button>
              <button class="test-option" type="button" aria-pressed="false"><span class="test-key">C</span>Chloride</button>
              <button class="test-option" type="button" aria-pressed="false"><span class="test-key">D</span>Calcium</button>
              </div>
            </div>

            <div class="test-nav">
              <button class="btn" type="button">Back</button>
              <span class="test-counter">3 of 24</span>
              <button class="btn btn-primary" type="button">Next</button>
            </div>
        </div>
      </div>
    </div>
  </div>
</main>
<script src="screens.js"></script>
<script src="icons.js"></script>
<script src="shell.js"></script>
</body>
</html>
