<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashcards — mixed review · Leffic design</title>
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="app-tokens.css">
<link rel="stylesheet" href="app-rail.css">
<link rel="stylesheet" href="app-controls.css">
<link rel="stylesheet" href="app-folder.css">
<link rel="stylesheet" href="app-flashcards.css">
<link rel="stylesheet" href="app-overlays.css">
</head>
<body class="shell" data-screen="flashcards-mixed">
<main class="shell-stage">
  <div class="frame">
    <div class="screen screen-fixed">
      <div class="page">
        <nav class="rail">
          <ul class="rail-list">
            <li class="rail-logo"><svg><use href="#icon-logo"/></svg></li>
            <li><a class="rail-item" href="home.html"><svg class="icon"><use href="#icon-home"/></svg>Home</a></li>
            <li><button class="rail-item" type="button"><svg class="icon"><use href="#icon-ask"/></svg><span>Ask</span></button></li>
          </ul>
          <div class="rail-foot">
            <svg class="icon"><use href="#icon-profile"/></svg>
            <span>Profile</span>
          </div>
        </nav>

        <div class="folder">
          <div class="folder-head">
            <svg><use href="#icon-folderOpen"/></svg>
            <span class="folder-name">Home</span>
          </div>
        </div>
      </div>

      <div class="overlay">
        <div class="overlay-close"><svg><use href="#icon-close"/></svg></div>

        <div class="flashcard">
          <div class="flashcard-progress">
            <div class="flashcard-progress-bar" style="width: 42%"></div>
            <span class="flashcard-progress-count">21/50</span>
          </div>

          <div class="flashcard-body">
            <span class="flashcard-face">Which ion channel opens first during depolarisation?</span>
          </div>

          <button class="flashcard-show-answer" type="button">Show answer</button>
        </div>
      </div>
    </div>
  </div>
</main>
<script src="screens.js"></script>
<script src="icons.js"></script>
<script src="shell.js"></script>
</body>
</html>
