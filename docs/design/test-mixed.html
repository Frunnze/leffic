<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test — mixed review · Leffic design</title>
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="app-tokens.css">
<link rel="stylesheet" href="app-rail.css">
<link rel="stylesheet" href="app-controls.css">
<link rel="stylesheet" href="app-folder.css">
<link rel="stylesheet" href="app-test.css">
<link rel="stylesheet" href="app-overlays.css">
</head>
<body class="shell" data-screen="test-mixed">
<main class="shell-stage">
  <div class="frame">
    <div class="screen screen-fixed">
      <div class="page">
        <nav class="rail">
          <ul class="rail-list">
            <li class="rail-logo"><svg><use href="#icon-logo"/></svg></li>
            <li><a class="rail-item" href="home.html"><svg class="icon"><use href="#icon-home"/></svg>Home</a></li>
            <li><button class="rail-item" type="button"><svg class="icon"><use href="#icon-ask"/></svg><span>Ask</span></button></li>
          </ul>
          <div class="rail-foot">
            <svg class="icon"><use href="#icon-profile"/></svg>
            <span>Profile</span>
          </div>
        </nav>

        <div class="folder">
          <div class="folder-head">
            <svg><use href="#icon-folderOpen"/></svg>
            <span class="folder-name">Home</span>
          </div>
        </div>
      </div>

      <div class="overlay">
        <div class="overlay-close"><svg><use href="#icon-close"/></svg></div>

        <div class="test-stage">
          <div class="test-card">
            <span class="test-question">Which pump restores the resting potential after repolarisation?</span>
            <hr class="divider">

            <div class="test-options">
              <div class="test-option">Calcium ATPase</div>
              <div class="test-option is-chosen">Sodium–potassium ATPase</div>
              <div class="test-option">Proton pump</div>
            </div>

            <hr class="divider">

            <div class="test-nav">
              <div class="test-nav-btn">Back</div>
              <div class="test-counter">7/40</div>
              <div class="test-nav-btn">Next</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
<script src="screens.js"></script>
<script src="icons.js"></script>
<script src="shell.js"></script>
</body>
</html>
