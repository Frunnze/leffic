<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folder — loading · Leffic design</title>
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="app-tokens.css">
<link rel="stylesheet" href="app-rail.css">
<link rel="stylesheet" href="app-controls.css">
<link rel="stylesheet" href="app-folder.css">
<link rel="stylesheet" href="app-units.css">
</head>
<body class="shell" data-screen="home-loading">
<main class="shell-stage">
  <div class="frame">
    <div class="screen">
      <div class="page">
      <nav class="rail" aria-label="Main">
        <div>
          <div class="rail-logo"><svg aria-hidden="true"><use href="#icon-logo"/></svg></div>
          <ul class="rail-list">
            <li><a class="rail-item" href="home.html" aria-current="page"><svg class="icon" aria-hidden="true"><use href="#icon-home"/></svg>Home</a></li>
            <li><button class="rail-item" type="button"><svg class="icon" aria-hidden="true"><use href="#icon-ask"/></svg>Ask</button></li>
          </ul>
        </div>
        <div class="rail-foot-wrap">
          <button class="rail-foot" type="button" aria-expanded="false">
            <svg class="icon" aria-hidden="true"><use href="#icon-profile"/></svg>Profile
          </button>
        </div>
      </nav>
      <div class="folder">
        <header class="folder-head">
          <div class="folder-title-row">
            <h1 class="folder-name">Home</h1>
          <div class="folder-actions">
            <div class="folder-action">
              <button class="btn btn-primary" type="button" aria-expanded="false"><svg class="icon-sm" aria-hidden="true"><use href="#icon-study"/></svg>Study</button>
            </div>
            <div class="folder-action">
              <button class="btn" type="button" aria-expanded="false"><svg class="icon-sm" aria-hidden="true"><use href="#icon-aiImport"/></svg>Import</button>
            </div>
            <div class="folder-action">
              <button class="btn btn-quiet btn-icon" type="button" aria-label="Folder options"><svg class="icon-sm" aria-hidden="true"><use href="#icon-dots"/></svg></button>
            </div>
          </div>
          </div>
        </header>
        <section>
          <div class="units-head">
            <h2 class="section-label">Loading</h2>
          </div>
          <div class="skeleton-list" aria-busy="true" aria-live="polite">
            <div class="skeleton-row"><span class="skeleton-dot"></span><span class="skeleton-bar" style="width: 46%"></span></div>
            <div class="skeleton-row"><span class="skeleton-dot"></span><span class="skeleton-bar" style="width: 62%"></span></div>
            <div class="skeleton-row"><span class="skeleton-dot"></span><span class="skeleton-bar" style="width: 38%"></span></div>
            <div class="skeleton-row"><span class="skeleton-dot"></span><span class="skeleton-bar" style="width: 54%"></span></div>
            <span class="visually-hidden">Loading folder contents</span>
          </div>
        </section>
      </div>
      </div>
    </div>
  </div>
</main>
<script src="screens.js"></script>
<script src="icons.js"></script>
<script src="shell.js"></script>
</body>
</html>
