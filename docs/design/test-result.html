<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test — result · Leffic design</title>
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="app-tokens.css">
<link rel="stylesheet" href="app-rail.css">
<link rel="stylesheet" href="app-controls.css">
<link rel="stylesheet" href="app-test.css">
</head>
<body class="shell" data-screen="test-result">
<main class="shell-stage">
  <div class="frame">
    <div class="screen screen-fixed">
      <nav class="rail" aria-label="Main">
        <div>
          <div class="rail-logo"><svg aria-hidden="true"><use href="#icon-logo"/></svg></div>
          <ul class="rail-list">
            <li><a class="rail-item" href="home.html"><svg class="icon" aria-hidden="true"><use href="#icon-home"/></svg>Home</a></li>
            <li><button class="rail-item" type="button"><svg class="icon" aria-hidden="true"><use href="#icon-ask"/></svg>Ask</button></li>
          </ul>
        </div>
        <div class="rail-foot-wrap">
          <button class="rail-foot" type="button" aria-expanded="false">
            <svg class="icon" aria-hidden="true"><use href="#icon-profile"/></svg>Profile
          </button>
        </div>
      </nav>
      <div class="test-stage">
        <div class="test-inner">
          <div class="test-card">
            <div class="test-result">
              <h1 class="section-label">Test complete</h1>
              <p class="test-score">19 / 24</p>
              <p class="test-score-detail">79% correct. The 5 you missed are back in the deck for tomorrow.</p>
              <div class="test-result-actions">
                <button class="btn btn-primary" type="button">Review the 5 missed</button>
                <button class="btn" type="button">Retake test</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
<script src="screens.js"></script>
<script src="icons.js"></script>
<script src="shell.js"></script>
</body>
</html>
