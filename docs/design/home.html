<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folder — with content · Leffic design</title>
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="app-tokens.css">
<link rel="stylesheet" href="app-shell.css">
<link rel="stylesheet" href="app-folder.css">
</head>
<body class="shell" data-screen="home">
<main class="shell-stage">
  <div class="frame">
    <div class="screen">
      <div class="page">
        <nav class="rail">
          <ul class="rail-list">
            <li class="rail-logo"><svg><use href="#icon-logo"/></svg></li>
            <li><a class="rail-item" href="home.html"><svg class="icon"><use href="#icon-home"/></svg>Home</a></li>
            <li><button class="rail-item" type="button"><svg class="icon"><use href="#icon-ask"/></svg><span>Ask</span></button></li>
          </ul>
          <div class="rail-foot">
            <svg class="icon"><use href="#icon-profile"/></svg>
            <span>Profile</span>
          </div>
        </nav>

        <div class="folder">
          <div class="folder-head">
            <svg><use href="#icon-folderOpen"/></svg>
            <span class="folder-name">Home</span>
          </div>

          <div class="folder-toolbar">
            <div class="folder-actions">
              <div class="folder-action">
                <button class="btn btn-solid" type="button"><svg class="icon-sm"><use href="#icon-study"/></svg><span>Study</span></button>
              </div>
              <div class="folder-action">
                <button class="btn" type="button"><svg class="icon-sm"><use href="#icon-aiImport"/></svg><span>AI Import</span></button>
              </div>
              <div class="folder-action">
                <button class="btn" type="button"><svg class="icon-sm"><use href="#icon-newFolder"/></svg><span>New folder</span></button>
              </div>
            </div>
            <button class="btn" type="button"><svg class="icon-sm"><use href="#icon-dots"/></svg></button>
          </div>

          <hr class="divider">

          <div class="stats">
            <div class="stat">
              <span class="stat-label">Flashcards</span>
              <div class="donut">
                <svg viewBox="0 0 100 100">
                  <circle class="donut-track" cx="50" cy="50" r="37.5"/>
                  <circle class="donut-value" cx="50" cy="50" r="37.5" stroke-dasharray="141.4 235.6"/>
                </svg>
                <div class="donut-legend">
                  <span><i class="swatch-due"></i>Due</span>
                  <span><i class="swatch-done"></i>Done</span>
                </div>
              </div>
            </div>

            <div class="stat">
              <span class="stat-label">Test items</span>
              <div class="donut">
                <svg viewBox="0 0 100 100">
                  <circle class="donut-track" cx="50" cy="50" r="37.5"/>
                  <circle class="donut-value" cx="50" cy="50" r="37.5" stroke-dasharray="180.7 235.6"/>
                </svg>
                <div class="donut-legend">
                  <span><i class="swatch-due"></i>Due</span>
                  <span><i class="swatch-done"></i>Done</span>
                </div>
              </div>
            </div>

            <div class="stat">
              <span class="stat-label">Notes</span>
              <div class="donut">
                <svg viewBox="0 0 100 100">
                  <circle class="donut-track" cx="50" cy="50" r="37.5"/>
                  <circle class="donut-value" cx="50" cy="50" r="37.5" stroke-dasharray="163.1 235.6"/>
                </svg>
                <div class="donut-legend">
                  <span><i class="swatch-due"></i>Due</span>
                  <span><i class="swatch-done"></i>Read</span>
                </div>
              </div>
            </div>
          </div>

          <hr class="divider">

          <div class="units">
            <div class="unit">
              <a class="unit-link" href="home.html">
                <span class="unit-main">
                  <svg class="icon"><use href="#icon-folder"/></svg>
                  <span class="unit-name">Neuroscience</span>
                </span>
                <button class="unit-menu-btn" type="button"><svg class="icon-sm"><use href="#icon-dots"/></svg></button>
              </a>
            </div>

            <div class="unit">
              <a class="unit-link" href="flashcards-question.html">
                <span class="unit-main">
                  <svg class="icon"><use href="#icon-flashcards"/></svg>
                  <span class="unit-name">Action potentials — deck</span>
                </span>
                <button class="unit-menu-btn" type="button"><svg class="icon-sm"><use href="#icon-dots"/></svg></button>
              </a>
            </div>

            <div class="unit">
              <a class="unit-link" href="test-question.html">
                <span class="unit-main">
                  <svg class="icon"><use href="#icon-test"/></svg>
                  <span class="unit-name">Action potentials — test</span>
                </span>
                <button class="unit-menu-btn" type="button"><svg class="icon-sm"><use href="#icon-dots"/></svg></button>
              </a>
            </div>

            <div class="unit">
              <a class="unit-link" href="notes-review.html">
                <span class="unit-main">
                  <svg class="icon"><use href="#icon-note"/></svg>
                  <span class="unit-name">Action potentials — note</span>
                </span>
                <button class="unit-menu-btn" type="button"><svg class="icon-sm"><use href="#icon-dots"/></svg></button>
              </a>
            </div>

            <div class="unit">
              <a class="unit-link" href="file-review.html">
                <span class="unit-main">
                  <svg class="icon"><use href="#icon-file"/></svg>
                  <span class="unit-name">action-potentials.pdf</span>
                </span>
                <button class="unit-menu-btn" type="button"><svg class="icon-sm"><use href="#icon-dots"/></svg></button>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
<script src="screens.js"></script>
<script src="icons.js"></script>
<script src="shell.js"></script>
</body>
</html>
