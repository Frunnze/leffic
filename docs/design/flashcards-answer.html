<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashcards — answer · Leffic design</title>
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="app-tokens.css">
<link rel="stylesheet" href="app-rail.css">
<link rel="stylesheet" href="app-controls.css">
<link rel="stylesheet" href="app-flashcards.css">
</head>
<body class="shell" data-screen="flashcards-answer">
<main class="shell-stage">
  <div class="frame">
    <div class="screen screen-fixed">
      <nav class="rail" aria-label="Main">
        <div>
          <div class="rail-logo"><svg aria-hidden="true"><use href="#icon-logo"/></svg></div>
          <ul class="rail-list">
            <li><a class="rail-item" href="home.html"><svg class="icon" aria-hidden="true"><use href="#icon-home"/></svg>Home</a></li>
            <li><button class="rail-item" type="button"><svg class="icon" aria-hidden="true"><use href="#icon-ask"/></svg>Ask</button></li>
          </ul>
        </div>
        <div class="rail-foot-wrap">
          <button class="rail-foot" type="button" aria-expanded="false">
            <svg class="icon" aria-hidden="true"><use href="#icon-profile"/></svg>Profile
          </button>
        </div>
      </nav>
      <div class="review">
        <div class="review-inner">
          <div class="review-progress">
            <div class="review-progress-meta">
              <span>Reviewed 8 of 30</span>
              <span>22 left</span>
            </div>
            <div class="review-track"><div class="review-fill" style="width: 27%"></div></div>
          </div>

          <div class="flashcard">
            <div class="flashcard-face">
              <p class="flashcard-prompt">What is the resting membrane potential of a typical neuron?</p>
            </div>
            <div class="flashcard-face flashcard-answer">
              <p class="flashcard-prompt">About −70 mV, held by the sodium–potassium pump and potassium leak channels.</p>
            </div>
          </div>

          <div class="review-actions">
            <button class="rating rating-again" type="button">Again <small>1 min · 1</small></button>
            <button class="rating rating-hard" type="button">Hard <small>8 min · 2</small></button>
            <button class="rating rating-good" type="button">Good <small>3 days · 3</small></button>
            <button class="rating rating-easy" type="button">Easy <small>12 days · 4</small></button>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
<script src="screens.js"></script>
<script src="icons.js"></script>
<script src="shell.js"></script>
</body>
</html>
