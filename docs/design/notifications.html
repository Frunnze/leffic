<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notifications · Leffic design</title>
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="app-tokens.css">
<link rel="stylesheet" href="app-rail.css">
<link rel="stylesheet" href="app-controls.css">
<link rel="stylesheet" href="app-folder.css">
<link rel="stylesheet" href="app-overlays.css">
</head>
<body class="shell" data-screen="notifications">
<main class="shell-stage">
  <div class="frame">
    <div class="screen screen-fixed">
      <div class="page">
        <nav class="rail">
          <ul class="rail-list">
            <li class="rail-logo"><svg><use href="#icon-logo"/></svg></li>
            <li><a class="rail-item" href="home.html"><svg class="icon"><use href="#icon-home"/></svg>Home</a></li>
            <li><button class="rail-item" type="button"><svg class="icon"><use href="#icon-ask"/></svg><span>Ask</span></button></li>
          </ul>
          <div class="rail-foot">
            <svg class="icon"><use href="#icon-profile"/></svg>
            <span>Profile</span>
          </div>
        </nav>

        <div class="folder">
          <div class="folder-head">
            <svg><use href="#icon-folderOpen"/></svg>
            <span class="folder-name">Home</span>
          </div>

          <div class="folder-toolbar">
            <div class="folder-actions">
              <div class="folder-action">
                <button class="btn btn-solid" type="button"><svg class="icon-sm"><use href="#icon-study"/></svg><span>Study</span></button>
              </div>
              <div class="folder-action">
                <button class="btn" type="button"><svg class="icon-sm"><use href="#icon-aiImport"/></svg><span>AI Import</span></button>
              </div>
            </div>
          </div>

          <hr class="divider">
        </div>
      </div>

      <div class="toast-stack">
        <div class="toast">
          <div class="toast-icon-start"><svg class="icon"><use href="#icon-start"/></svg></div>
          <div class="toast-text">
            <span>The generation started!</span>
            <span class="toast-detail">You'll be notified when done.</span>
          </div>
          <div class="toast-close"><svg><use href="#icon-close"/></svg></div>
        </div>

        <div class="toast">
          <div class="toast-icon-success"><svg class="icon"><use href="#icon-success"/></svg></div>
          <div class="toast-text">
            <span>Task completed</span>
            <span class="toast-detail">Flashcards successfully created!</span>
          </div>
          <div class="toast-close"><svg><use href="#icon-close"/></svg></div>
        </div>

        <div class="toast">
          <div class="toast-icon-failure"><svg class="icon"><use href="#icon-failure"/></svg></div>
          <div class="toast-text">
            <span>Task failure</span>
            <span class="toast-detail">The note was not created. Try again!</span>
          </div>
          <div class="toast-close"><svg><use href="#icon-close"/></svg></div>
        </div>
      </div>
    </div>
  </div>
</main>
<script src="screens.js"></script>
<script src="icons.js"></script>
<script src="shell.js"></script>
</body>
</html>
