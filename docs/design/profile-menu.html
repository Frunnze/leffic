<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folder — profile menu · Leffic design</title>
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="app-tokens.css">
<link rel="stylesheet" href="app-rail.css">
<link rel="stylesheet" href="app-controls.css">
<link rel="stylesheet" href="app-folder.css">
<link rel="stylesheet" href="app-units.css">
</head>
<body class="shell" data-screen="profile-menu">
<main class="shell-stage">
  <div class="frame">
    <div class="screen screen-fixed">
      <div class="page">
      <nav class="rail" aria-label="Main">
        <div>
          <div class="rail-logo"><svg aria-hidden="true"><use href="#icon-logo"/></svg></div>
          <ul class="rail-list">
            <li><a class="rail-item" href="home.html"><svg class="icon" aria-hidden="true"><use href="#icon-home"/></svg>Home</a></li>
            <li><button class="rail-item" type="button"><svg class="icon" aria-hidden="true"><use href="#icon-ask"/></svg>Ask</button></li>
          </ul>
        </div>
        <div class="rail-foot-wrap">
          <button class="rail-foot" type="button" aria-expanded="true">
            <svg class="icon" aria-hidden="true"><use href="#icon-profile"/></svg>Profile
          </button>
          <div class="dropdown">
            <button class="dropdown-item" type="button"><svg class="icon-sm" aria-hidden="true"><use href="#icon-settings"/></svg>Settings</button>
            <button class="dropdown-item" type="button"><svg class="icon-sm" aria-hidden="true"><use href="#icon-logout"/></svg>Log out</button>
          </div>
        </div>
      </nav>
      <div class="folder">
        <header class="folder-head">
          <div class="folder-title-row">
            <h1 class="folder-name">Home</h1>
          <div class="folder-actions">
            <div class="folder-action">
              <button class="btn btn-primary" type="button" aria-expanded="false"><svg class="icon-sm" aria-hidden="true"><use href="#icon-study"/></svg>Study</button>
            </div>
            <div class="folder-action">
              <button class="btn" type="button" aria-expanded="false"><svg class="icon-sm" aria-hidden="true"><use href="#icon-aiImport"/></svg>Import</button>
            </div>
            <div class="folder-action">
              <button class="btn btn-quiet btn-icon" type="button" aria-label="Folder options"><svg class="icon-sm" aria-hidden="true"><use href="#icon-dots"/></svg></button>
            </div>
          </div>
          </div>
        </header>
        <section>
        <div class="units">
          <div class="unit">
            <a class="unit-link" href="home.html">
              <svg class="icon unit-icon" aria-hidden="true"><use href="#icon-folder"/></svg>
              <span class="unit-body">
                <span class="unit-name">Neuroscience</span>
                <span class="unit-meta">6 items · edited 2 days ago</span>
              </span>
              
            </a>
            <button class="btn btn-quiet btn-icon unit-menu" type="button" aria-label="More actions for Neuroscience"><svg class="icon-sm" aria-hidden="true"><use href="#icon-dots"/></svg></button>
          </div>
          <div class="unit">
            <a class="unit-link" href="flashcards-question.html">
              <svg class="icon unit-icon" aria-hidden="true"><use href="#icon-flashcards"/></svg>
              <span class="unit-body">
                <span class="unit-name">Action potentials — deck</span>
                <span class="unit-meta">30 cards</span>
              </span>
              <span class="unit-badge">12 due</span>
            </a>
            <button class="btn btn-quiet btn-icon unit-menu" type="button" aria-label="More actions for Action potentials — deck"><svg class="icon-sm" aria-hidden="true"><use href="#icon-dots"/></svg></button>
          </div>
          <div class="unit">
            <a class="unit-link" href="test-question.html">
              <svg class="icon unit-icon" aria-hidden="true"><use href="#icon-test"/></svg>
              <span class="unit-body">
                <span class="unit-name">Action potentials — test</span>
                <span class="unit-meta">30 questions</span>
              </span>
              <span class="unit-badge">7 due</span>
            </a>
            <button class="btn btn-quiet btn-icon unit-menu" type="button" aria-label="More actions for Action potentials — test"><svg class="icon-sm" aria-hidden="true"><use href="#icon-dots"/></svg></button>
          </div>
        </div>
        </section>
      </div>
      </div>
    </div>
  </div>
</main>
<script src="screens.js"></script>
<script src="icons.js"></script>
<script src="shell.js"></script>
</body>
</html>
