[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.12"
venvPath = ".."
venv = ".venv"
stubPath = "stubs"
include = ["src", "run.py", "tests"]
extraPaths = [".", "src"]

reportMissingTypeStubs = "none"

[[tool.basedpyright.executionEnvironments]]
root = "tests"
extraPaths = [".", "src"]
reportPrivateUsage = "none"

[tool.ruff]
line-length = 79
target-version = "py312"
src = [".", "src"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = ["ALL", "PLR0904", "PLR1702", "PLW0717", "PLW1514"]
ignore = [
    "COM812",
    "CPY001",
    "D",
    "INP001",
    "ISC003",
    "PERF401",
    "PLR0913",
    "S602",
    "S603",
    "S607",
]

[tool.ruff.lint.pylint]
max-public-methods = 15

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "EM101",
    "EM102",
    "PLR2004",
    "PT009",
    "S101",
    "SLF001",
    "S108",
    "TRY003",
    "TRY004",
]

[tool.mutmut]
source_paths = ["src"]
also_copy = ["pytest.ini"]
pytest_add_cli_args_test_selection = ["tests"]

[tool.deptry.per_rule_ignores]
DEP002 = ["uvicorn", "bcrypt"]

[tool.deptry]
known_first_party = ["src", "run", "app_factory", "features", "shared"]
